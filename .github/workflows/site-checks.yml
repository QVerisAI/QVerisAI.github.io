name: Site checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  site-checks:
    name: Blog manifest and site build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.3.0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test manifest generation across timezones
        run: node --test scripts/generate-blog-manifests.test.mjs
      - name: Check committed blog manifests
        run: pnpm blog:manifest:check
      - name: Build site
        run: pnpm run build
